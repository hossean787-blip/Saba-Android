name: SURA APK build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/sura-apk-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME" || { echo "Android SDK is unavailable"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Gradle permissions
        run: chmod +x ./gradlew
      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Restore original release signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SURA_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SURA_RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SURA_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SURA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!n}" ]]; then echo "::error::Missing release signing secret: $n"; exit 1; fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sura-release.jks"
          test -s "$RUNNER_TEMP/sura-release.jks"
          echo "SURA_RELEASE_STORE_FILE=$RUNNER_TEMP/sura-release.jks" >> "$GITHUB_ENV"
          echo "SURA_RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SURA_RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SURA_RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify release signature and identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SURA_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          TOOLS="$ANDROID_HOME/build-tools/$BT"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          ACTUAL="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL"
          if [[ -n "${EXPECTED_CERT_SHA256:-}" ]]; then
            EXP="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            [[ "$ACTUAL" == "$EXP" ]] || { echo "::error::Signer certificate differs from the previously installed app"; exit 1; }
          else
            echo "::warning::SURA_EXPECTED_CERT_SHA256 not set; upgrade compatibility was not checked"
          fi
          "$TOOLS/aapt" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/badging.txt"
          grep -q "name='ir.saba.invoice'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SURA-signed-release-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 14
