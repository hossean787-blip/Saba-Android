name: SURA signed APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -f "$SDK/build-tools/34.0.0/apksigner" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0"
          fi
      - name: Verify release signing secrets are configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SURA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURA_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SURA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"; do
            if [[ -z "$value" ]]; then
              echo "::error::Release signing secrets are not fully configured. No APK will be published."
              exit 1
            fi
          done
      - name: Build and verify signed release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURA_RELEASE_KEYSTORE_BASE64 }}
          SURA_RELEASE_STORE_PASSWORD: ${{ secrets.SURA_RELEASE_STORE_PASSWORD }}
          SURA_RELEASE_KEY_ALIAS: ${{ secrets.SURA_RELEASE_KEY_ALIAS }}
          SURA_RELEASE_KEY_PASSWORD: ${{ secrets.SURA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SURA_RELEASE_STORE_FILE="$(mktemp "${RUNNER_TEMP}/sura-signing-XXXXXX.jks")"
          export SURA_RELEASE_STORE_FILE
          trap 'rm -f "$SURA_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SURA_RELEASE_STORE_FILE"
          # Normalize accidental copy/paste line endings in the non-secret alias.
          SURA_RELEASE_KEY_ALIAS="$(printf '%s' "$SURA_RELEASE_KEY_ALIAS" | tr -d '\r\n')"
          export SURA_RELEASE_KEY_ALIAS
          # Fail early on invalid keystore credentials without exposing secret values.
          keytool -list -keystore "$SURA_RELEASE_STORE_FILE" -storepass "$SURA_RELEASE_STORE_PASSWORD" -alias "$SURA_RELEASE_KEY_ALIAS" >/dev/null
          # Previous run failed on a stale KSP Room schema from Gradle cache.
          bash ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" |
            grep -E 'Signer #1 certificate SHA-256 digest:' |
            tee app/build/outputs/apk/release/signing-certificate-sha256.txt
      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: sura-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/signing-certificate-sha256.txt
          if-no-files-found: error
