name: SURA Home Moadian Android Instrumentation
on:
  push:
    branches:
      - main
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/instrumentation-pr14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM where available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No /dev/kvm; emulator will try software acceleration."
          fi
      - name: Execute Android device tests and actual UI captures (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Collect actual emulator UI captures
        if: always()
        run: |
          mkdir -p app/build/emulator-screenshots
          adb pull /sdcard/Android/data/ir.saba.invoice/files/screenshots/ app/build/emulator-screenshots/ || true
      - name: Upload device test XML, logs and HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-home-moadian-device-results
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/
            app/build/emulator-screenshots/
