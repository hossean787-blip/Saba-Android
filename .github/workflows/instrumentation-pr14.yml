name: SURA Home Moadian Android Instrumentation
on:
  push:
    branches:
      - main
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/instrumentation-pr14.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'Android SDK directory unavailable'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/34.0.0" ]]; then
            set +o pipefail
            yes | sdkmanager --licenses >/dev/null
            set -o pipefail
            sdkmanager --install "platforms;android-35" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM where available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No /dev/kvm; emulator will try software acceleration."
          fi
      - name: Execute Android device tests and actual UI captures (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Collect actual emulator UI captures
        if: always()
        run: |
          mkdir -p app/build/emulator-screenshots
          adb pull /sdcard/Android/data/ir.saba.invoice/files/screenshots/ app/build/emulator-screenshots/ || true
      - name: Upload device test XML, logs and HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-home-moadian-device-results
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/
            app/build/emulator-screenshots/
