name: SURA Home Moadian Android Instrumentation
on:
  push:
    branches:
      - main
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/instrumentation-pr14.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'Android SDK directory unavailable'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/34.0.0" ]]; then
            set +o pipefail
            yes | sdkmanager --licenses >/dev/null
            set -o pipefail
            sdkmanager --install "platforms;android-35" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM where available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No /dev/kvm; emulator will try software acceleration."
          fi
      - name: Execute Android device tests and actual UI captures (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            # connectedDebugAndroidTest cleans up installed packages after reporting.
            # Reinstall locally built APKs, rerun only the synthetic visual test,
            # and retrieve its frames while the target package remains installed.
            APP_APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
            TEST_APK="$(find app/build/outputs/apk/androidTest -name '*.apk' -type f -print -quit)"
            test -n "$APP_APK"
            test -n "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            adb shell am instrument -w -e class ir.saba.invoice.StartupLogoVisualInstrumentedTest ir.saba.invoice.test/androidx.test.runner.AndroidJUnitRunner > app/build/sura-intro-verification.txt
            cat app/build/sura-intro-verification.txt
            grep -q 'OK (1 test)' app/build/sura-intro-verification.txt
            mkdir -p app/build/emulator-screenshots
            adb pull /sdcard/Android/data/ir.saba.invoice/files/screenshots/ app/build/emulator-screenshots/
            find app/build/emulator-screenshots -type f -name 'sura-intro-particles-emulator.png' -size +1000c -print -quit | grep -q .
            find app/build/emulator-screenshots -type f -name 'sura-intro-mark-emulator.png' -size +1000c -print -quit | grep -q .
      - name: Verify captured emulator frames
        run: |
          find app/build/emulator-screenshots -type f -name '*.png' -printf '%f %s bytes\n'
      - name: Upload device test XML, logs and HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-home-moadian-device-results
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/
            app/build/emulator-screenshots/
            app/build/sura-intro-verification.txt
