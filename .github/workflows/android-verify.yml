name: Android verify
on:
  push:
    branches: [main, feature/moadian-core-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify installed Android SDK
        run: |
          test -d "$ANDROID_HOME" || exit 1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: saba-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
