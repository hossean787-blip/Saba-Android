name: SURA signed release upgrade on Android emulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sura-signed-upgrade-emulator.yml'
      - 'scripts/verify-signed-upgrade.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signed-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified signed builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/build/upgrade/previous app/build/upgrade/current
          # Compare the known signed 0.29.0 with the tested signed 0.33.0
          # directly; no uninstall and no ephemeral debug signing key.
          # Never use a debug APK, change signing keys, or uninstall existing data.
          gh run download 42545190530 -n SURA-signed-release-apk-248 \
            -D app/build/upgrade/previous --repo ${{ github.repository }}
          gh run download 42685768067 -n SURA-signed-release-apk-257 \
            -D app/build/upgrade/current --repo ${{ github.repository }}
          test -s app/build/upgrade/previous/app-release.apk
          test -s app/build/upgrade/current/app-release.apk
          echo "Both signed release archives were retrieved."

      - name: Validate matching package identity, release signatures and upgrade order
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -x "$SDK/build-tools/34.0.0/apksigner" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          fi
          export AAPT="$SDK/build-tools/34.0.0/aapt"
          export SIGNER="$SDK/build-tools/34.0.0/apksigner"
          PREVIOUS="app/build/upgrade/previous/app-release.apk"
          CURRENT="app/build/upgrade/current/app-release.apk"
          "$SIGNER" verify --verbose "$PREVIOUS"
          "$SIGNER" verify --verbose "$CURRENT"
          OLD_BADGING="$("$AAPT" dump badging "$PREVIOUS" | head -n 1)"
          NEW_BADGING="$("$AAPT" dump badging "$CURRENT" | head -n 1)"
          echo "$OLD_BADGING"
          echo "$NEW_BADGING"
          [[ "$OLD_BADGING" == *"name='ir.saba.invoice'"* && "$OLD_BADGING" == *"versionCode='29'"* ]]
          [[ "$NEW_BADGING" == *"name='ir.saba.invoice'"* && "$NEW_BADGING" == *"versionCode='33'"* ]]
          old_cert="$("$SIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          new_cert="$("$SIGNER" verify --print-certs "$CURRENT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$old_cert" && "$old_cert" == "$new_cert" ]]
          echo "Release certificate continuity verified."
          sha256sum "$PREVIOUS" "$CURRENT" > app/build/upgrade/apk-sha256.txt

      - name: Enable KVM hardware acceleration where available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM not available; software emulation fallback."
          fi
      - name: Boot emulator and verify in-place signed upgrade (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/verify-signed-upgrade.sh

      - name: Upload proof of upgrade and launch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-signed-upgrade-device-proof-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/upgrade/*.txt
            app/build/upgrade/*.png
