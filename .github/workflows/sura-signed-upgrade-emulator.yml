name: SURA signed release upgrade on Android emulator

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Successful standard signed APK baseline run ID'
        required: true
        default: '45813818399'
        type: string
      current_run_id:
        description: 'Successful standard signed APK candidate run ID'
        required: true
        default: '45821631984'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/sura-signed-upgrade-emulator.yml'
      - 'scripts/verify-signed-upgrade.sh'

permissions:
  contents: read
  actions: read

jobs:
  signed-upgrade:
    # Validate the explicitly chosen, successful 0.131 -> 0.137 signed pair.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified signed builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id || '45813818399' }}
          CURRENT_RUN_ID: ${{ inputs.current_run_id || '45821631984' }}
        run: |
          set -euo pipefail
          mkdir -p app/build/upgrade/previous app/build/upgrade/current
          # Only accept successful standard release workflow runs on this repository's main branch.
          [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ && "$CURRENT_RUN_ID" =~ ^[0-9]+$ && "$PREVIOUS_RUN_ID" != "$CURRENT_RUN_ID" ]]
          for run_id in "$PREVIOUS_RUN_ID" "$CURRENT_RUN_ID"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" \
              '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/android-signed-release.yml"' >/dev/null
          done
          gh run download "$PREVIOUS_RUN_ID" -n sura-signed-release-apk \
            -D app/build/upgrade/previous --repo "$GITHUB_REPOSITORY"
          gh run download "$CURRENT_RUN_ID" -n sura-signed-release-apk \
            -D app/build/upgrade/current --repo "$GITHUB_REPOSITORY"
          printf 'previous_run_id=%s\ncurrent_run_id=%s\n' "$PREVIOUS_RUN_ID" "$CURRENT_RUN_ID" > app/build/upgrade/source-runs.txt
          test -s app/build/upgrade/previous/app-release.apk
          test -s app/build/upgrade/current/app-release.apk
          echo "Both signed release archives were retrieved."

      - name: Validate matching package identity, release signatures and upgrade order
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -x "$SDK/build-tools/34.0.0/apksigner" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          fi
          export AAPT="$SDK/build-tools/34.0.0/aapt"
          export SIGNER="$SDK/build-tools/34.0.0/apksigner"
          PREVIOUS="app/build/upgrade/previous/app-release.apk"
          CURRENT="app/build/upgrade/current/app-release.apk"
          "$SIGNER" verify --verbose "$PREVIOUS"
          "$SIGNER" verify --verbose "$CURRENT"
          OLD_BADGING="$("$AAPT" dump badging "$PREVIOUS" | head -n 1)"
          NEW_BADGING="$("$AAPT" dump badging "$CURRENT" | head -n 1)"
          echo "$OLD_BADGING"
          echo "$NEW_BADGING"
          [[ "$OLD_BADGING" == *"name='ir.saba.invoice'"* && "$NEW_BADGING" == *"name='ir.saba.invoice'"* ]]
          old_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<< "$OLD_BADGING")"
          new_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<< "$NEW_BADGING")"
          [[ "$old_code" =~ ^[0-9]+$ && "$new_code" =~ ^[0-9]+$ ]]
          (( new_code > old_code ))
          echo "PREVIOUS_VERSION_CODE=$old_code" >> "$GITHUB_ENV"
          echo "CURRENT_VERSION_CODE=$new_code" >> "$GITHUB_ENV"
          old_cert="$("$SIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          new_cert="$("$SIGNER" verify --print-certs "$CURRENT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$old_cert" && "$old_cert" == "$new_cert" ]]
          [[ "$new_cert" == "55a5c9f677f899630bc792330606161560a8dea94b7fe0eabe11d47a013d7b0b" ]] || {
            echo "::error::Current APK release signing certificate is not SURA's established identity."
            exit 1
          }
          echo "Release certificate continuity verified."
          sha256sum "$PREVIOUS" "$CURRENT" > app/build/upgrade/apk-sha256.txt

      - name: Enable KVM hardware acceleration where available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM not available; software emulation fallback."
          fi
      - name: Boot emulator and verify in-place signed upgrade (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/verify-signed-upgrade.sh

      - name: Upload proof of upgrade and launch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-signed-upgrade-device-proof-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/upgrade/*.txt
            app/build/upgrade/*.png
