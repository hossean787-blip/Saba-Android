name: Moadian Android verification

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/moadian-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moadian-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Check Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version
      - name: Build and run JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Publish test reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moadian-debug-build-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
