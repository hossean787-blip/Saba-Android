name: SURA Manager emulator smoke
on:
  push:
    branches: [main]
    paths:
      - 'sura-admin-android/**'
      - '.github/workflows/sura-manager-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build independent Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -p sura-admin-android :app:assembleDebug
      - name: Enable hardware virtualization
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install APK and verify login screen on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash sura-admin-android/tests/emulator_smoke.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-manager-emulator-proof-api${{ matrix.api-level }}
          path: sura-admin-android/app/build/emulator-proof/*
          if-no-files-found: warn
          retention-days: 14
