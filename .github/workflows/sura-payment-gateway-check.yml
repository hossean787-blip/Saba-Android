name: SURA ZarinPal payment guards
on:
  push:
    branches: [main]
    paths:
      - 'backend/supabase/functions/sura-zarinpal/**'
      - 'backend/supabase/functions/sura-credit-quote/**'
      - 'tests/sura-zarinpal-rules.test.mjs'
      - 'payment-egress/**'
      - '.github/workflows/sura-payment-gateway-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check deployed Edge Function with Deno
        run: |
          deno check backend/supabase/functions/sura-zarinpal/index.ts
          deno check backend/supabase/functions/sura-credit-quote/index.ts
      - name: Exercise payment guards without real transactions
        run: |
          node --experimental-strip-types --test tests/sura-zarinpal-rules.test.mjs
          node --test payment-egress/gateway_proxy.test.mjs
