name: SURA Credit Test APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/sura-credit-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0"
      - name: Validate Gradle wrapper
        run: test -f gradle/wrapper/gradle-wrapper.jar && test -f gradlew
      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SURA-credit-test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SURA-credit-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
