name: SURA Manager source verification
# Build generated assets from source before validating and exercising the manager app.
on:
  push:
    branches: [main]
    paths:
      - 'sura-admin-android/**'
      - 'supabase/functions/sura-manager-support/**'
      - '.github/workflows/sura-manager-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix sura-admin-android install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix sura-admin-android run web:build
      - run: node sura-admin-android/tools/build-manager-api.cjs
      - run: |
          python3 sura-admin-android/tests/static_guard.py
          node --check sura-admin-android/app/src/main/assets/admin/manager.js
          node sura-admin-android/tests/backend_routes.cjs
          node sura-admin-android/tests/manager_support.cjs
          node sura-admin-android/tests/report_zip_test.cjs
          node sura-admin-android/tests/manager_filters.cjs
          node sura-admin-android/tests/manager_gift.cjs
